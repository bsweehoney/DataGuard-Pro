name: Deploy Azure Function

on:
  push:
    branches: [main]
    paths:
      - 'azurefunc/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: dataguard-func-app
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'azurefunc'
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for testing
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found"
          fi

      - name: Validate syntax
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: python -m py_compile function_app.py

      - name: Install dependencies for deployment package
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Verify deployment
        run: |
          sleep 15
          response=$(curl -s -o /dev/null -w "%{http_code}" https://dataguard-func-app.azurewebsites.net/api/dataguardscanner)
          if [ "$response" -eq 200 ]; then
            echo "Deployment verified"
          else
            echo "Deployment check failed with HTTP $response"
            exit 1
          fi
